[versions]
kotlin = "2.4.0"
shadow = "9.6.0"

velocity = "4.1.0-SNAPSHOT"
graph = "0.1.0-R0.1-SNAPSHOT"
mariadb = "3.5.9"
exposed = "1.3.1"
hikaricp = "7.1.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
graph = { module = "net.azisaba:graph", version.ref = "graph" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
